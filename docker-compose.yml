version: '3.8'

services:
  backend:
    build: .
    command: python run_server.py
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - CRAG_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
